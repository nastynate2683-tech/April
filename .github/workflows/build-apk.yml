name: Build Android Debug APK

on:
  push:
    branches:
      - build/android-debug-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'AnonymousClockstopper_TrueDepth_Gyro_FIXED_download.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP was not found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/android-project"
          mkdir -p "$RUNNER_TEMP/android-project"
          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d "$RUNNER_TEMP/android-project"

          echo "Extracted project:"
          find "$RUNNER_TEMP/android-project" -maxdepth 3 -type f | sort | head -200

      - name: Locate Gradle project
        id: locate_project
        shell: bash
        run: |
          PROJECT_ROOT=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ] || \
               [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_ROOT="$DIR"
              break
            fi
          done < <(find "$RUNNER_TEMP/android-project" -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' -o \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' \
          \) | sort)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Could not locate Android Gradle project."
            exit 1
          fi

          echo "Android project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
with:
  packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ steps.locate_project.outputs.project_root }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "No Gradle wrapper found. Installing Gradle 8.7."
            sudo apt-get update
            sudo apt-get install -y unzip
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -O "$RUNNER_TEMP/gradle.zip"
            sudo mkdir -p /opt/gradle
            sudo unzip -q "$RUNNER_TEMP/gradle.zip" -d /opt/gradle
            echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

      - name: Create local.properties
        working-directory: ${{ steps.locate_project.outputs.project_root }}
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build debug APK
        working-directory: ${{ steps.locate_project.outputs.project_root }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find generated APK
        id: find_apk
        working-directory: ${{ steps.locate_project.outputs.project_root }}
        shell: bash
        run: |
          APK="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was produced."
            find . -type f | grep -E '\.apk$' || true
            exit 1
          fi

          echo "APK found: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AnonymousClockstopper-debug-apk
          path: ${{ steps.locate_project.outputs.project_root }}/${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error
